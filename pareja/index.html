<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nuestro Mochi</title>
<meta name="theme-color" content="#ffe3ec">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mochi">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap">
<style>
:root {
  --bg-1: #ffe3ec; --bg-2: #f1e3ff; --bg-3: #fff0f4;
  --card: rgba(255, 255, 255, .72); --card-line: rgba(255, 255, 255, .9);
  --ink: #4a2236; --soft: #9a6b80; --pill: rgba(255, 228, 236, .9);
  --pink: #ff6f91; --pink-deep: #e94a76; --pink-soft: #ff8fab; --lilac: #b98cff; --gold: #ffc94d; --glow: 233, 74, 118;
  --ok: #26a96c; --shadow: 0 12px 34px rgba(233, 74, 118, .16);
  --spring: cubic-bezier(.34, 1.56, .64, 1);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg-1: #2a1522; --bg-2: #1e1530; --bg-3: #241521; --card: rgba(52, 28, 44, .72); --card-line: rgba(255, 255, 255, .08);
  --ink: #ffe8f0; --soft: #d7a7bb; --pill: rgba(255, 111, 145, .14); --shadow: 0 12px 34px rgba(0, 0, 0, .35); color-scheme: dark;
} }
/* tema océano (cada teléfono elige el suyo; la mascota y su crecimiento son los mismos) */
:root[data-skin="oceano"] {
  --bg-1: #d9efff; --bg-2: #d6f5ec; --bg-3: #eef6fb; --ink: #17324a; --soft: #5f7d93; --pill: rgba(214, 236, 250, .9);
  --pink: #2f8fd8; --pink-deep: #1f6fb5; --pink-soft: #5fb3ec; --lilac: #34c3a5; --glow: 31, 111, 181;
  --shadow: 0 12px 34px rgba(31, 111, 181, .16);
}
@media (prefers-color-scheme: dark) { :root[data-skin="oceano"]:not([data-theme="light"]) {
  --bg-1: #10243a; --bg-2: #0f2a2a; --bg-3: #0f1a26; --card: rgba(22, 40, 58, .72); --ink: #e3f1ff; --soft: #93b4cc;
  --pill: rgba(95, 179, 236, .14); --shadow: 0 12px 34px rgba(0, 0, 0, .35);
} }
:root[data-theme="dark"] {
  --bg-1: #2a1522; --bg-2: #1e1530; --bg-3: #241521; --card: rgba(52, 28, 44, .72); --card-line: rgba(255, 255, 255, .08);
  --ink: #ffe8f0; --soft: #d7a7bb; --pill: rgba(255, 111, 145, .14); --shadow: 0 12px 34px rgba(0, 0, 0, .35); color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; }
body {
  min-height: 100dvh; color: var(--ink); font: 500 16px/1.4 "Fredoka", ui-rounded, system-ui, -apple-system, sans-serif;
  background: radial-gradient(120% 60% at 0% 0%, var(--bg-1), transparent 70%),
              radial-gradient(120% 60% at 100% 40%, var(--bg-2), transparent 70%), var(--bg-3);
  background-attachment: fixed;
  padding: max(16px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
  overflow-x: hidden;
}
main { position: relative; z-index: 1; max-width: 460px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; }

/* corazones flotando en el fondo */
#bg { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
#bg span { position: absolute; bottom: -40px; opacity: .35; animation: drift linear infinite; }
@keyframes drift { to { transform: translateY(-115vh) rotate(25deg); } }

header { position: relative; text-align: center; padding: 4px 58px 0; }
#skinBtn { position: absolute; right: 0; top: 0; padding: 8px 12px; font-size: 14px; }
h1 { font-size: 28px; font-weight: 700; margin: 0; letter-spacing: -.01em; }
h1 .beat { display: inline-block; animation: beat 1.4s ease-in-out infinite; }
@keyframes beat { 0%, 60%, 100% { transform: scale(1); } 15% { transform: scale(1.25); } 30% { transform: scale(1.05); } 45% { transform: scale(1.18); } }
#stageName { margin: 2px 0 0; color: var(--soft); font-weight: 600; }

.card { background: var(--card); border: 1px solid var(--card-line); border-radius: 28px; padding: 18px;
  box-shadow: var(--shadow); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
  animation: rise .7s var(--spring) both; }
.card + .card { animation-delay: .12s; }
@keyframes rise { from { opacity: 0; transform: translateY(24px) scale(.97); } }

.stats { display: flex; justify-content: space-between; gap: 8px; font-weight: 600; }
.pill { background: var(--pill); border-radius: 999px; padding: 7px 13px; white-space: nowrap; }
.flame { display: inline-block; transform-origin: 50% 90%; animation: flicker 1.1s ease-in-out infinite alternate; }
@keyframes flicker { to { transform: scale(1.15) rotate(-6deg); } }

#pet { position: relative; display: grid; place-items: center; cursor: pointer; touch-action: manipulation;
  user-select: none; -webkit-user-select: none; padding-top: 6px; }
#pet svg { width: min(100%, 290px); height: auto; aspect-ratio: 1; overflow: visible; }
#hop, #bodyg, #breath, #eyes, .sway, .float, .twinkle, .flapL, #aura { transform-box: fill-box; }
#hop { transform-origin: 50% 100%; animation: hop 3.2s ease-in-out infinite; }
@keyframes hop { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
#bodyg { transform-origin: 50% 100%; }
#breath { transform-origin: 50% 100%; animation: breathe 3.2s ease-in-out infinite; }
@keyframes breathe { 0%, 100% { transform: scale(1, 1); } 50% { transform: scale(1.025, .975); } }
#pet.squish #bodyg { animation: squish .38s var(--spring); }
@keyframes squish { 0% { transform: scale(1, 1); } 30% { transform: scale(1.12, .86); } 60% { transform: scale(.95, 1.06); } 100% { transform: scale(1, 1); } }
#eyes { transform-origin: 50% 50%; animation: blink 4.5s infinite; }
@keyframes blink { 0%, 93%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
#mouthOpen { opacity: 0; }
#pet.squish #mouth { opacity: 0; }
#pet.squish #mouthOpen { opacity: 1; }
.sway { transform-origin: 50% 100%; animation: sway 2.6s ease-in-out infinite alternate; }
@keyframes sway { from { transform: rotate(-8deg); } to { transform: rotate(8deg); } }
.float { animation: floaty 2.4s ease-in-out infinite alternate; }
@keyframes floaty { to { transform: translateY(-5px); } }
.twinkle { transform-origin: 50% 50%; animation: twinkle 1.8s ease-in-out infinite; }
.twinkle:nth-child(2) { animation-delay: .5s; } .twinkle:nth-child(3) { animation-delay: 1s; } .twinkle:nth-child(4) { animation-delay: 1.4s; }
@keyframes twinkle { 0%, 100% { opacity: .2; transform: scale(.6) rotate(0); } 50% { opacity: 1; transform: scale(1.1) rotate(45deg); } }
.flapL { transform-origin: 100% 50%; animation: flap .9s ease-in-out infinite alternate; }
@keyframes flap { to { transform: rotate(-14deg); } }
#aura { transform-origin: 50% 50%; animation: aura 3s ease-in-out infinite; }
@keyframes aura { 50% { transform: scale(1.06); opacity: .75; } }
#body, #belly { transition: rx .7s var(--spring), ry .7s var(--spring); }
#pet.evolve #hop { animation: evolve 1.1s var(--spring); }
@keyframes evolve { 0% { transform: scale(1); } 30% { transform: scale(.7) rotate(-10deg); } 65% { transform: scale(1.18) rotate(360deg); } 100% { transform: scale(1) rotate(360deg); } }

.pop { position: absolute; pointer-events: none; font-size: 22px; left: 50%; top: 45%;
  animation: pop .95s cubic-bezier(.2, .8, .3, 1) forwards; }
@keyframes pop { from { transform: translate(-50%, 0) scale(.4); opacity: 1; }
  to { transform: translate(calc(-50% + var(--x)), var(--y)) scale(1.3) rotate(var(--r)); opacity: 0; } }

.mood { text-align: center; font-size: 22px; font-weight: 700; margin: 2px 0 0; }
.hint { text-align: center; color: var(--soft); margin: 2px 0 0; font-size: 14px; }
.meter { display: flex; align-items: center; gap: 10px; margin-top: 14px; font-size: 14px; color: var(--soft); font-weight: 600; }
.bar { flex: 1; height: 14px; background: var(--pill); border-radius: 999px; overflow: hidden; }
.bar i { position: relative; display: block; height: 100%; border-radius: inherit; overflow: hidden;
  background: linear-gradient(90deg, var(--pink-soft), var(--pink), var(--lilac)); transition: width .5s var(--spring); }
.bar i::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, transparent, rgba(255,255,255,.55), transparent);
  transform: translateX(-100%); animation: shine 2.4s ease-in-out infinite; }
@keyframes shine { 60%, 100% { transform: translateX(100%); } }

/* camino de evolución */
.path { display: flex; justify-content: space-between; align-items: center; margin-top: 16px; position: relative; }
.path::before { content: ""; position: absolute; left: 18px; right: 18px; top: 50%; height: 3px; border-radius: 3px; background: var(--pill); }
.path span { position: relative; width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; font-size: 19px;
  background: var(--pill); filter: grayscale(1); opacity: .45; transition: all .4s var(--spring); }
.path span.got { filter: none; opacity: 1; }
.path span.now { background: #fff; transform: scale(1.22); box-shadow: 0 0 0 3px var(--pink), 0 6px 16px rgba(var(--glow), .35); }
#next { text-align: center; color: var(--soft); font-size: 14px; margin: 10px 0 0; }

/* celebración de evolución */
#evo { position: fixed; inset: 0; z-index: 5; display: none; place-items: center; background: rgba(var(--glow), .18);
  -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); padding: 24px; }
#evo.show { display: grid; animation: fade .3s ease both; }
@keyframes fade { from { opacity: 0; } }
#evo div { background: var(--card); border-radius: 28px; padding: 26px 22px; text-align: center; box-shadow: var(--shadow); max-width: 320px;
  animation: rise .6s var(--spring) both; }
#evo b { display: block; font-size: 64px; line-height: 1.1; animation: beat 1.2s ease-in-out infinite; }
#evo h2 { margin: 8px 0 4px; font-size: 24px; }
#evo p { margin: 0; color: var(--soft); }
.confetti { position: fixed; top: 40%; left: 50%; width: 10px; height: 14px; border-radius: 3px; z-index: 6; pointer-events: none;
  animation: confetti 1.6s cubic-bezier(.15, .7, .3, 1) forwards; }
@keyframes confetti { to { transform: translate(var(--x), var(--y)) rotate(var(--r)); opacity: 0; } }

/* radio */
h2.title { margin: 0 0 12px; font-size: 21px; }
.row { display: flex; gap: 8px; }
input { flex: 1; min-width: 0; font: inherit; font-size: 16px; padding: 13px 15px; border-radius: 16px; border: 2px solid transparent;
  background: var(--pill); color: var(--ink); outline: none; transition: border-color .2s; }
input:focus { border-color: var(--pink); }
button { font: inherit; font-weight: 700; border: 0; border-radius: 16px; padding: 13px 18px; color: #fff; cursor: pointer;
  background: linear-gradient(135deg, var(--pink-soft), var(--pink-deep)); box-shadow: 0 6px 16px rgba(var(--glow), .3);
  transition: transform .15s var(--spring), box-shadow .2s; }
button:active { transform: scale(.95); }
button.ghost { background: var(--pill); color: var(--ink); box-shadow: none; }
#status { color: var(--soft); margin: 10px 2px; font-size: 14px; }
#status.on { color: var(--ok); font-weight: 600; }
#talk { width: 100%; height: 150px; border-radius: 36px; font-size: 22px; touch-action: none; user-select: none; -webkit-user-select: none;
  -webkit-touch-callout: none; }
#talk:disabled { opacity: .45; box-shadow: none; }
#talk.live { background: linear-gradient(135deg, var(--pink), var(--pink-deep)); transform: scale(.97); animation: ring 1s ease-out infinite; }
@keyframes ring { from { box-shadow: 0 0 0 0 rgba(var(--glow), .55); } to { box-shadow: 0 0 0 22px rgba(var(--glow), 0); } }
#incoming { text-align: center; font-weight: 700; color: var(--pink-deep); min-height: 1.4em; margin: 10px 0 0; }
#incoming:not(:empty) { animation: rise .4s var(--spring); }
.opts { display: flex; gap: 8px; margin-top: 12px; }
.opts button { flex: 1; font-size: 14px; padding: 10px; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; }
  #bg { display: none; }
}
</style>
</head>
<body>
<div id="bg" aria-hidden="true"></div>
<main>
  <header>
    <button class="ghost" id="skinBtn" aria-label="Cambiar tema">🎨</button>
    <h1>Nuestro Mochi <span class="beat">💞</span></h1>
    <p id="stageName"></p>
  </header>

  <section class="card">
    <div class="stats"><span class="pill"><span class="flame">🔥</span> <span id="streak">0 días</span></span><span class="pill" id="today">0/50 hoy</span></div>
    <div id="pet" role="button" aria-label="Dale tap para alimentar a Mochi">
      <svg viewBox="0 0 200 200" aria-hidden="true">
        <defs>
          <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1"><stop id="c1" offset="0"/><stop id="c2" offset="1"/></linearGradient>
          <radialGradient id="glow"><stop offset="0" stop-color="#ffe08a" stop-opacity=".8"/><stop offset=".6" stop-color="#ff9ec0" stop-opacity=".35"/><stop offset="1" stop-color="#ff9ec0" stop-opacity="0"/></radialGradient>
        </defs>
        <circle id="aura" data-min="4" cx="100" cy="112" r="98" fill="url(#glow)"/>
        <g data-min="3" fill="#ffc94d">
          <path class="twinkle" d="M28 60 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3z"/>
          <path class="twinkle" d="M172 72 l2.5 6 6 2.5 -6 2.5 -2.5 6 -2.5 -6 -6 -2.5 6 -2.5z"/>
          <path class="twinkle" d="M34 150 l2 5 5 2 -5 2 -2 5 -2 -5 -5 -2 5 -2z" fill="#ff8fb1"/>
          <path class="twinkle" d="M168 148 l3 7 7 3 -7 3 -3 7 -3 -7 -7 -3 7 -3z" fill="#c9a0ff"/>
        </g>
        <ellipse cx="100" cy="186" id="shadow" rx="60" ry="7" fill="#7a2a48" opacity=".12"/>
        <g id="hop">
          <g data-min="5">
            <g id="wingL"><path class="flapL" d="M0 0 q-30 -26 -38 2 q14 -2 10 14 q14 2 28 -16z" fill="#fff" stroke="#ffb3c8" stroke-width="2.5"/></g>
            <g id="wingR"><g transform="scale(-1 1)"><path class="flapL" d="M0 0 q-30 -26 -38 2 q14 -2 10 14 q14 2 28 -16z" fill="#fff" stroke="#ffb3c8" stroke-width="2.5"/></g></g>
          </g>
          <g id="bodyg"><g id="breath">
            <ellipse id="body" cx="100" cy="120" rx="70" ry="62" fill="url(#skin)"/>
            <ellipse id="belly" cx="100" cy="137" rx="42" ry="34" fill="#fff" opacity=".42"/>
            <ellipse cx="78" cy="84" rx="14" ry="7" fill="#fff" opacity=".45" transform="rotate(-25 78 84)"/>
            <g id="eyes">
              <circle id="eyeL" cx="80" cy="108" r="7.5" fill="#3b1d2a"/>
              <circle id="eyeR" cx="120" cy="108" r="7.5" fill="#3b1d2a"/>
              <circle id="shineL" cx="82.5" cy="105" r="2.6" fill="#fff"/>
              <circle id="shineR" cx="122.5" cy="105" r="2.6" fill="#fff"/>
            </g>
            <path id="brows" d="" stroke="#3b1d2a" stroke-width="3" stroke-linecap="round" fill="none"/>
            <ellipse id="cheekL" cx="66" cy="124" rx="9" ry="6" fill="#ff6f91"/>
            <ellipse id="cheekR" cx="134" cy="124" rx="9" ry="6" fill="#ff6f91"/>
            <path id="mouth" d="" stroke="#3b1d2a" stroke-width="3.5" stroke-linecap="round" fill="none"/>
            <ellipse id="mouthOpen" cx="100" cy="142" rx="6" ry="5" fill="#7a2338"/>
            <g id="phones" data-min="3">
              <path id="band" d="" stroke="#3a4250" stroke-width="6" stroke-linecap="round" fill="none"/>
              <rect id="cupL" width="14" height="26" rx="6" style="fill: var(--pink-deep)"/>
              <rect id="cupR" width="14" height="26" rx="6" style="fill: var(--pink-deep)"/>
            </g>
            <g id="head">
              <g data-max="0"><path class="sway" d="M100 60 q-5 -16 6 -22 q3 11 -6 22" fill="#7ccf8f"/></g>
              <g data-min="1" data-max="4" class="sway">
                <path d="M100 60 v-16" stroke="#5fb877" stroke-width="3" stroke-linecap="round"/>
                <path d="M100 50 q-14 -12 -22 -3 q9 11 22 3" fill="#7ccf8f"/>
                <path d="M100 50 q14 -12 22 -3 q-9 11 -22 3" fill="#8edb9f"/>
                <g data-min="2">
                  <g fill="#ffffff"><circle cx="100" cy="33" r="6"/><circle cx="107" cy="38" r="6"/><circle cx="104" cy="46" r="6"/><circle cx="96" cy="46" r="6"/><circle cx="93" cy="38" r="6"/></g>
                  <circle cx="100" cy="41" r="4.5" fill="#ffc94d"/>
                </g>
              </g>
              <ellipse data-min="4" data-max="4" class="float" cx="100" cy="18" rx="20" ry="5.5" fill="none" stroke="#ffc94d" stroke-width="3.5"/>
              <g data-min="5" class="float">
                <path d="M80 60 L82 38 L92 48 L100 32 L108 48 L118 38 L120 60 Z" fill="#ffc94d" stroke="#e9a91c" stroke-width="2" stroke-linejoin="round"/>
                <circle cx="100" cy="50" r="4" fill="#ff6f91"/><circle cx="88" cy="53" r="2.6" fill="#b98cff"/><circle cx="112" cy="53" r="2.6" fill="#b98cff"/>
              </g>
            </g>
          </g></g>
        </g>
      </svg>
    </div>
    <p class="mood" id="mood"></p>
    <p class="hint">Tap tap para alimentarlo ✨ Si no lo alimentan, se pone flaquito.</p>
    <div class="meter">Pancita <div class="bar" aria-label="Peso"><i id="weight"></i></div></div>
    <div class="path" id="path"></div>
    <p id="next"></p>
  </section>

  <section class="card">
    <h2 class="title">📻 Radio 1 a 1</h2>
    <div class="row">
      <input id="code" placeholder="Código secreto de los dos" autocomplete="off" autocapitalize="off">
      <button id="connect">Conectar</button>
    </div>
    <p id="status">Usen el mismo código en los dos teléfonos.</p>
    <button id="talk" disabled>Mantén para hablar</button>
    <p id="incoming"></p>
    <div class="opts">
      <button class="ghost" id="wake">☀️ Pantalla siempre encendida: no</button>
    </div>
  </section>
</main>
<div id="evo" role="dialog" aria-live="polite"><div><b id="evoIcon"></b><h2 id="evoTitle"></h2><p>¡Sigan alimentándolo juntos para que siga creciendo!</p></div></div>
<audio id="rx" autoplay playsinline></audio>

<script src="peerjs.min.js"></script>
<script type="module">
import { fresh, tick, tap, merge, mood, DAILY_GOAL, STAGES, stageOf } from './pet.js';
const $ = id => document.getElementById(id);
const rand = (a, b) => a + Math.random() * (b - a);

/* ---------- Tema (se guarda solo en este teléfono) ---------- */
const THEMES = {
  rosa:   { bg: ['💗', '💕', '✨', '🌸'], tap: ['💗', '💖', '✨', '🍓'], partner: ['💌', '💕'], color: '#ffe3ec' },
  oceano: { bg: ['💙', '🌿', '✨', '🌊'], tap: ['💙', '⚡', '✨', '🍓'], partner: ['💌', '🤙'], color: '#d9efff' },
};
let skin = 'rosa';
try { skin = THEMES[localStorage.getItem('mochi-skin')] ? localStorage.getItem('mochi-skin') : 'rosa'; } catch {}
function applySkin() {
  document.documentElement.dataset.skin = skin;
  document.querySelector('meta[name=theme-color]').content = THEMES[skin].color;
  $('skinBtn').textContent = skin === 'rosa' ? '🎨 🌸' : '🎨 🌊';
  [...$('bg').children].forEach((el, i) => el.textContent = THEMES[skin].bg[i % 4]);
}
$('skinBtn').onclick = () => { skin = skin === 'rosa' ? 'oceano' : 'rosa'; try { localStorage.setItem('mochi-skin', skin); } catch {} applySkin(); render(); };

/* ---------- Fondo ---------- */
for (let i = 0; i < 12; i++) {
  const s = document.createElement('span');
  Object.assign(s.style, { left: rand(0, 95) + '%', fontSize: rand(14, 28) + 'px', animationDuration: rand(14, 26) + 's', animationDelay: -rand(0, 26) + 's' });
  $('bg').append(s);
}
applySkin();
$('path').innerHTML = STAGES.map(s => `<span title="${s.name}">${s.icon}</span>`).join('');

/* ---------- Mascota ---------- */
let state;
try { state = JSON.parse(localStorage.getItem('mochi')); } catch {}
state = state ? tick(state, Date.now()) : fresh(Date.now());
const save = () => { try { localStorage.setItem('mochi', JSON.stringify(state)); } catch {} };
let seenStage = Number(localStorage.getItem('mochi-stage') ?? stageOf(state.streak));

function render() {
  const w = state.weight, k = w / 100, st = stageOf(state.streak), S = STAGES[st];
  const rx = 34 + 56 * k, ry = 66 - 8 * k;          // flaco → gordo
  $('body').setAttribute('rx', rx); $('body').setAttribute('ry', ry);
  $('belly').setAttribute('rx', 16 + 34 * k); $('belly').setAttribute('ry', 26 + 10 * k);
  const ex = 14 + 10 * k;
  $('eyeL').setAttribute('cx', 100 - ex); $('eyeR').setAttribute('cx', 100 + ex);
  $('shineL').setAttribute('cx', 102.5 - ex); $('shineR').setAttribute('cx', 102.5 + ex);
  $('cheekL').setAttribute('cx', 100 - ex - 12); $('cheekR').setAttribute('cx', 100 + ex + 12);
  for (const c of ['cheekL', 'cheekR']) $(c).setAttribute('opacity', 0.15 + 0.55 * k);
  $('shadow').setAttribute('rx', 30 + 50 * k);
  $('mouth').setAttribute('d', `M88 140 Q100 ${140 + (k - 0.4) * 30} 112 140`);
  $('brows').setAttribute('d', w < 30 ? `M${100 - ex - 8} 98 L${100 - ex + 6} 92 M${100 + ex + 8} 98 L${100 + ex - 6} 92` : '');
  $('head').setAttribute('transform', `translate(0 ${62 - ry})`);
  $('band').setAttribute('d', `M${101 - rx} ${118 - ry * 0.2} C${101 - rx} ${105 - ry * 1.25} ${99 + rx} ${105 - ry * 1.25} ${99 + rx} ${118 - ry * 0.2}`);
  $('cupL').setAttribute('x', 94 - rx); $('cupR').setAttribute('x', 92 + rx);
  for (const c of ['cupL', 'cupR']) $(c).setAttribute('y', 106 - ry * 0.2);
  $('wingL').setAttribute('transform', `translate(${110 - rx} 112)`);
  $('wingR').setAttribute('transform', `translate(${90 + rx} 112)`);
  $('c1').setAttribute('stop-color', S.skin[skin][0]); $('c2').setAttribute('stop-color', S.skin[skin][1]);
  document.querySelectorAll('#pet [data-min], #pet [data-max]').forEach(el =>
    el.style.display = st >= (+el.dataset.min || 0) && st <= (el.dataset.max ? +el.dataset.max : 99) ? '' : 'none');

  $('mood').textContent = mood(w);
  $('weight').style.width = w + '%';
  $('streak').textContent = `${state.streak} ${state.streak === 1 ? 'día' : 'días'}`;
  $('today').textContent = state.todayTaps >= DAILY_GOAL ? '✅ Alimentado hoy' : `🍓 ${state.todayTaps}/${DAILY_GOAL} hoy`;
  $('stageName').textContent = `${S.icon} ${S.name}`;
  [...$('path').children].forEach((el, i) => { el.classList.toggle('got', i <= st); el.classList.toggle('now', i === st); });
  const N = STAGES[st + 1];
  $('next').textContent = N ? `Próxima evolución: ${N.icon} ${N.name} en ${N.min - state.streak} ${N.min - state.streak === 1 ? 'día' : 'días'} de racha` : '👑 ¡Llegaron a la evolución máxima!';

  if (st > seenStage) celebrate(S);
  if (st !== seenStage) { seenStage = st; try { localStorage.setItem('mochi-stage', st); } catch {} }
}

function burst(emojis, n) {
  for (let i = 0; i < n; i++) {
    const h = document.createElement('span');
    h.className = 'pop'; h.textContent = emojis[i % emojis.length];
    h.style.setProperty('--x', rand(-90, 90) + 'px'); h.style.setProperty('--y', rand(-150, -70) + 'px'); h.style.setProperty('--r', rand(-40, 40) + 'deg');
    $('pet').append(h); setTimeout(() => h.remove(), 950);
  }
}

function celebrate(S) {
  $('evoIcon').textContent = S.icon; $('evoTitle').textContent = `¡Mochi evolucionó a ${S.name}!`;
  $('evo').classList.add('show'); $('pet').classList.add('evolve');
  navigator.vibrate?.([60, 40, 60, 40, 120]);
  const colors = ['#ff6f91', '#ffc94d', '#b98cff', '#7ccf8f', '#7fd3ff', '#2f8fd8'];
  for (let i = 0; i < 60; i++) {
    const c = document.createElement('i'); c.className = 'confetti';
    c.style.background = colors[i % colors.length];
    c.style.setProperty('--x', rand(-200, 200) + 'px'); c.style.setProperty('--y', rand(-320, 360) + 'px'); c.style.setProperty('--r', rand(-720, 720) + 'deg');
    document.body.append(c); setTimeout(() => c.remove(), 1600);
  }
  setTimeout(() => $('pet').classList.remove('evolve'), 1100);
  setTimeout(() => $('evo').classList.remove('show'), 4000);
}
$('evo').onclick = () => $('evo').classList.remove('show');

function feed(fromPartner) {
  state = tap(state, Date.now()); save(); render();
  const pet = $('pet');
  pet.classList.remove('squish'); void pet.getBoundingClientRect(); pet.classList.add('squish');
  clearTimeout(feed.t); feed.t = setTimeout(() => pet.classList.remove('squish'), 380);
  burst(fromPartner ? THEMES[skin].partner : THEMES[skin].tap, 3);
}
$('pet').addEventListener('pointerdown', () => {
  feed(false); navigator.vibrate?.(8);
  if (conn?.open) conn.send({ t: 'tap' });
});
setInterval(() => { state = tick(state, Date.now()); save(); render(); }, 30000);
render();

/* ---------- Radio (WebRTC con PeerJS) ---------- */
// Los dos usan el mismo código: el primero toma "-1", el segundo "-2" y llama al primero.
let peer, conn, mic, code, dialer;
const status = (txt, on) => { $('status').textContent = txt; $('status').classList.toggle('on', !!on); };
const setMic = on => mic?.getAudioTracks().forEach(t => t.enabled = on);
$('code').value = localStorage.getItem('mochi-code') || '';

$('connect').onclick = async () => {
  code = $('code').value.trim().toLowerCase().replace(/[^a-z0-9]/g, '');
  if (code.length < 4) return status('El código necesita al menos 4 letras o números.');
  try { localStorage.setItem('mochi-code', code); } catch {}
  $('rx').play().catch(() => {});                     // desbloquea el audio con este toque
  try {
    mic ??= await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } });
  } catch { return status('Necesito permiso del micrófono para la radio.'); }
  setMic(false);
  start(1);
  mediaSession();
};

function start(n) {
  clearInterval(dialer); peer?.destroy();
  status('Conectando…');
  peer = new Peer(`mochi-radio-${code}-${n}`);
  peer.on('open', () => {
    status('Esperando a tu amor… 💭');
    if (n === 2) { dial(); dialer = setInterval(() => { if (!conn?.open) dial(); }, 4000); }
  });
  peer.on('error', e => {
    if (e.type === 'unavailable-id') return n === 1 ? start(2) : setTimeout(() => start(1), 3000);
    if (e.type === 'peer-unavailable') return;          // aún no llega; el dialer reintenta
    status('Problema de conexión (' + e.type + '), reintentando…');
    setTimeout(() => start(n), 3000);
  });
  peer.on('disconnected', () => peer.reconnect());
  peer.on('call', c => { c.answer(mic); bindCall(c); });
  peer.on('connection', bindConn);
}
function dial() {
  const other = `mochi-radio-${code}-1`;
  bindConn(peer.connect(other, { reliable: true }));
  bindCall(peer.call(other, mic));
}
function bindCall(c) {
  c.on('stream', s => { $('rx').srcObject = s; $('rx').play().catch(() => {}); });
}
function bindConn(c) {
  c.on('open', () => {
    conn = c; status('Conectados 💞 La radio funciona aunque la pantalla se apague (deja la app abierta).', true);
    $('talk').disabled = false; c.send({ t: 'state', s: state });
  });
  c.on('data', d => {
    if (d.t === 'tap') feed(true);
    if (d.t === 'state') { state = merge(state, d.s, Date.now()); save(); render(); }
    if (d.t === 'talk') { $('incoming').textContent = d.on ? '🎙️ Tu amor está hablando…' : ''; if (d.on) navigator.vibrate?.(40); }
  });
  c.on('close', () => { if (conn === c) { conn = null; $('talk').disabled = true; $('incoming').textContent = ''; status('Se desconectó, esperando… 💭'); } });
}

// Mantener para hablar: el micrófono ya está conectado, solo se activa → sin demora.
const talk = on => {
  if (!conn?.open) return;
  setMic(on); $('talk').classList.toggle('live', on);
  $('talk').textContent = on ? '🔴 Hablando…' : 'Mantén para hablar';
  conn.send({ t: 'talk', on }); navigator.vibrate?.(15);
};
const btn = $('talk');
btn.addEventListener('pointerdown', e => { btn.setPointerCapture(e.pointerId); talk(true); });
for (const ev of ['pointerup', 'pointercancel']) btn.addEventListener(ev, () => talk(false));
btn.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('keydown', e => { if (e.code === 'Space' && !e.repeat && e.target === document.body) talk(true); });
document.addEventListener('keyup', e => { if (e.code === 'Space') talk(false); });

// Controles en la pantalla de bloqueo / notificación del teléfono.
function mediaSession() {
  if (!('mediaSession' in navigator)) return;
  navigator.mediaSession.metadata = new MediaMetadata({ title: 'Radio con mi amor 💞', artist: 'Nuestro Mochi',
    artwork: [{ src: 'icon-512.png', sizes: '512x512', type: 'image/png' }] });
  navigator.mediaSession.setActionHandler('play', () => $('rx').play());
  navigator.mediaSession.setActionHandler('pause', () => $('rx').play()); // no dejar que se pause la radio
}

// Pantalla siempre encendida (opcional, gasta batería). El sistema la suelta al salir de la app; se reactiva al volver.
let lock = null, wantWake = false;
const label = () => $('wake').textContent = `☀️ Pantalla siempre encendida: ${wantWake ? 'sí' : 'no'}`;
async function grabWake() {
  try { lock = await navigator.wakeLock.request('screen'); lock.onrelease = () => { lock = null; }; }
  catch { wantWake = false; label(); alert('Tu navegador no permite mantener la pantalla encendida.'); }
}
$('wake').onclick = () => { wantWake = !wantWake; label(); wantWake ? grabWake() : lock?.release(); };
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  state = tick(state, Date.now()); render();
  if (wantWake && !lock) grabWake();
});

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
